name: ci

on:
  push:
  pull_request:

jobs:
  shim:
    # Self-hosted ARC scale set; `runners` is the label every private orvexai
    # repo uses and is verified working. GitHub-hosted runners are metered on a
    # private org repo, so `ubuntu-latest` queued forever and never started.
    runs-on: runners
    env:
      # Per A15 the suite needs a writable HOME as well as loopback binding and
      # a pty. It serves a fake releases/latest/download over 127.0.0.1 and
      # asserts on observed behaviour, so it cannot run in a sandbox lacking
      # any of the three.
      HOME: ${{ runner.temp }}/orvex-bmad-home
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Prepare a writable HOME
        run: mkdir -p "$HOME"

      - name: Parse the shim
        run: bash -n install/bmad

      - name: shellcheck
        run: shellcheck install/bmad

      # The shim must run under the stock bash macOS ships, which is 3.2.57.
      # This guard is duplicated inside the suite; keeping it here too means a
      # bash-4 construct fails fast and by name.
      - name: Reject bash-4-only constructs
        run: |
          set -euo pipefail
          if grep -nE '\$\{[^}]+,,\}|\$\{[^}]+\^\^\}|declare[[:space:]]+-A|(^|[[:space:]])mapfile([[:space:]]|$)|readarray' install/bmad; then
            echo "::error::install/bmad uses bash 4 constructs; macOS ships bash 3.2"
            exit 1
          fi

      - name: Shim suite
        run: bash install/test-bmad.sh

      - name: Suite must not modify tracked files
        run: |
          set -euo pipefail
          if ! git diff --exit-code; then
            echo "::error::the shim suite modified tracked files"
            exit 1
          fi
